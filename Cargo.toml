[workspace]
members = [
    "crates/sim",
    "crates/gpu",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# GPU / window
wgpu = "22"
winit = { version = "0.30", features = ["rwh_06"] }
pollster = "0.3"

# UI
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"

# Concurrency
crossbeam-channel = "0.5"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image encoding
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

# Native file dialogs
rfd = "0.15"
